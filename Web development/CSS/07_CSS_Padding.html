<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            box-sizing: border-box;
        }
        div{
            border: solid 1px;
            padding-top:100px;
            padding-right:150px;
            padding-bottom:100px;
            padding-left:80px;
            background-color: lightblue;
        }
        .one{
            padding: 20px 25px 30px 35px;
            background-color: green;
        }

        #one{
            background-color: red;
            padding-left:100px;
            padding-bottom:100px;
            margin-top: 100px;

        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css padding</title>
</head>
<body>
    <div>This div element has a top padding 100px, a right padding 150px, a bottom padding 100px and left padding 80px</div>
    <p class="one">Shorthand property of padding</p>

    <p id="one">This is paragraph</p>
    <p id="two">This is new paragraph</p>
    
</body>
</html>
