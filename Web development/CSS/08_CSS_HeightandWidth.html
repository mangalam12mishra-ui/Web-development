<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .one {
            height: 200px;
            width: 35%;
            background-color: powderblue;
            color: red;
        }
        #one{
            max-width: 500px;
            padding: 10px;
            background-color: powderblue;
        }
        #two{
            max-width:100px;
            padding: 10px;
            background-color: powderblue;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and width</title>
</head>

<body>
    <h1>Set the height and width of an element</h1>
    <p class="one">This paragarph contain 200px height and 50% width</p>

    <h1>Min and max height and width</h1>
    <p id = "one">This paragraph has max-width of 500px</p>
    <p id="two">This paragraph has a max-width 100px</p>
    

</body>

</html>
