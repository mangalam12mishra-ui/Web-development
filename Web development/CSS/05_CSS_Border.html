<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p.one{
            border-style: outset;
        }
        p.two{
            border-style: solid;
            /* border-width: 5px; */
            border-width: 5px 10px 20px 3px;/*top right bottom left */
        }
        p.three{
            border-style: solid;
            border-color: red;
        }
        p.four{
            border-left:6px solid violet;
            
        }
        p.five{
            border: solid 3px navy;
        }
        .six{
            border: solid green 3px;
            border-radius: 5px;
        }



    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="one">Border style</p>
    <p class="two">Border width</p>
    <p class="three">Border color</p>
    <p class="four">Border sides</p>
    <p class="five">Shorthand border</p>
    <p class="six">Border radius</p>
</body>
</html>
