<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images folder</title>


    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="player">

<h1>Images</h1>

<input type="file" id="images" accept="images/*">

<h3 id="image">No image selected</h3>

<image id="image"></image>

<div class="controls">

<button id="prev">
<i class="fa-solid fa-backward"></i>
</button>

<button id="zoom">
<i class="fa-solid fa-play"></i>
</button>

<button id="next">
<i class="fa-solid fa-forward"></i>
</button>

</div>

<div class="time">

<span id="current">0:00</span>

<input type="range"
id="progress"
value="0">

<span id="duration">0:00</span>

</div>

<h3>Volume</h3>

<input type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1">

<br><br>

<a href="../index/index.html">
<button class="home">⬅ Home</button>
</a>

</div>


</body>
</html>
