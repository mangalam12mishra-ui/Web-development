<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imp tags</title>
</head>

<body>

    <header>
        <nav>
            <a href="TheHomeaddress">Home</a>
        </nav>
    </header>

    The main opening tag
    <main>
        A page section
        <section>
            A self-contained content

            <article>
                Content goes here
                <div>I am content inside div</div>
                <span>I am content inside span</span>
            </article>

        </section>
        Content aside from the main content (e.g. Ads, sidebars)

        <aside>
            Aside content goes here
        </aside>

    </main>
    The main closing tag
    <footer>
        I am content inside footer
    </footer>

</body>

</html>
