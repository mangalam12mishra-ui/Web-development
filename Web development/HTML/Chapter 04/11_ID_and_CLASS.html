<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id and class Example</title>
    <style>
        #para{
            background-color: red;
            color: white;
            text-align: center;
        }
        .class{
            background-color: goldenrod;
            color: wheat;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>This is Id example</h1>
    <p id="para">In this paragraph we add style using id tag. and we add the red color in the background of this paragraph.</p>
    <p id="para">This is second paragraph with same id</p>

    <p class="class">In this paragraph we use the class and style the paragraph. and we add the golden color in background of this paragraph.</p>

        
</body>
</html>
