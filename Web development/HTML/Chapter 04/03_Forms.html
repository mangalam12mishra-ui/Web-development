<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms HTML</title>
</head>

<body>
    <h1>Forms in HTML</h1>
    <form action="/submit.php">

        <div>
            <label for="Name">Name:</label>
            <input id="Name" type="text" placeholder="Enter name" required>
        </div>

        <div>
            <label for="Ph">Phone:</label>
            <input id="Ph" type="ph" placeholder="Phone no" required>
        </div>
        <div>
            <label for="Email">Email:</label>
            <input id="Email" type="email" placeholder="Enter email" required>
        </div>
        <div>
            <label for="Dob">DOB:</label>
            <input id="dob" type="date" placeholder="Enter DOB" required>
        </div>

        <div>
            <label for="Gender">Gender:</label>
            <select id="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="male">Male</option>
                <option value="femail">Femail</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <h2>Subscribtion plan</h2>

            <input id="basic" type="radio" name="subscription" value="Basic">
            <label for="basic">Basic</label>

            <input id="primium" type="radio" name="subscription" value="primium">
            <label for="primium">Primium</label>

            <input id="vip" type="radio" name="subscription" value="vip">
            <label for="vip">VIP</label>

        </div>

        <div>
            <input id="click" type="checkbox" required>
            <label for="click">I agree to terms and conditions.</label>
        </div>

        <div>
            <label for="Comments">Enter comments</label>
            <!-- <input id = "comments" type = "text" placeholder="Enter your comments"> -->
            <textarea id="comments" placeholder="Enter your comments" rows="4">

             </textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>

</html>
